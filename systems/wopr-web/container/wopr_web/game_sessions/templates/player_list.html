{% extends "gs_base.html" %}

{% block main_content %}
<h2>Players</h2>
{% if players %}
<ul>
    {% for player in players %}
    <li><a href="{% url 'player_view_specific' player_id=player.id %}">{{ player.irl_name }} - {{ player.handle }}</a></li>
    {% endfor %}
</ul>
{% else %}
<p>No players available.</p>
{% endif %}
{% endblock %}
