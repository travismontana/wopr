{% extends "gs_base.html" %}

{% block main_content %}
<h2>Games</h2>
{% if games %}
<ul>
    {% for game in games %}
    <li>
        <form action="{% url 'game_edit' game_id=game.id %}" method="get" style="display:inline;">
            <button type="submit">Edit</button>
        </form>
        <a href="{% url 'game_view_specific' game_id=game.id %}">{{ game.name }}</a>
    </li>
    {% endfor %}
</ul>
{% else %}
<p>No games available.</p>
{% endif %}
{% endblock %}
