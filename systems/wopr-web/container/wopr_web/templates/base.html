{% load static %}

<!DOCTYPE html>
<html>
  <head>
    <title>{% block title %}WOPR - Web Frontend{% endblock %}</title>
    <link href="{% static 'style.css' %}" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
        <div class="logo">
            {% include 'logo.html' %}
        </div>
        <div class="nav">
          <table class="nav-table">
            <tr>
              <td><a href="{% url 'index' %}">Home</a></td>
              <td><a href="{% url 'admin:index' %}" target="_blank">Admin</a></td>
            </tr>
            <tr>
              <td><a href="{% url 'images_index' %}">Images</a></td>
              <td><a href="{% url 'gs_index' %}">Game Sessions</a></td>
            </tr>
            <tr>
              <td><a href="{% url 'cameras_index' %}">Cameras</a></td>
            </tr>
          </table>
          <br>
        </div>
        <div class="sidebar">
            {% block sidebar %}
            {% endblock %}
            <div style="margin-top: auto;">
              Page Generated at: {{ now }} UTC<br>
            </div>
        </div>
        <div class="header">
            {% include 'header.html' %}
        </div>
        <div class="main">
            {% block main_content %}
            {% endblock %}
        </div>
    </div>

  </body>
</html>
