wopr-baseapp:
  app:
    name: wopr-luigi
  replicaCount: 1

  image:
    registry: docker.io
    repository: spotify/luigi
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8082

  ingress:
    enabled: true
    className: wopr-traefik
    hosts:
      - host: luigi.wopr.tailandtraillabs.org
        paths:
          - path: /
            pathType: Prefix
    tls: 
      - secretName: wopr-luigi-tls
        hosts:
          - luigi.wopr.tailandtraillabs.org

  env:
    - name: WOPR_API_URL
      valueFrom:
        configMapKeyRef:
          name: wopr-config
          key: WOPR_API_URL
