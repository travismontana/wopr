{% extends "base.html" %}

{% block main_subheader %}
<h2>Training Setup</h2>
{% endblock %}

{% block content %}

<div class="training-setup">
    <form method="post" action="{% url 'training_results' %}">
      <input type="hidden" name="training_run_id" value="{{ training_run.id }}">
      <input type="hidden" name="model_version_id" value="{{ model_ver.id }}">
      <input type="hidden" name="dataset_id" value="{{ dataset.id }}">
        {% csrf_token %}
        <fieldset>
            <legend>Configure Training Parameters</legend>
            <div class="form-group">
                <p><strong>Model:</strong></p> {{model.name}}<br>
                <p><strong>Dataset:</strong></p> {{dataset.artifact_uri}}<br>
    <div class="form-group">
      <label for="epochs">Epochs</label>
      <input type="number" id="epochs" name="epochs" 
             value="100" min="10" max="500" step="10" required>
      <small>Typical: 50-300</small>
    </div>

    <div class="form-group">
      <label for="imgsz">Image Size (px)</label>
      <select id="imgsz" name="imgsz" required>
        <option value="320">320 (fast, low detail)</option>
        <option value="640" selected>640 (balanced)</option>
        <option value="1024">1024 (slow, high detail)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="batch">Batch Size</label>
      <input type="number" id="batch" name="batch" 
             value="16" min="1" max="64" step="1" required>
      <small>Auto if -1, typical: 16-32</small>
    </div>
  </fieldset>

<!--
  <fieldset>
    <legend>Advanced (Optional)</legend>
    
    <div class="form-group">
      <label for="patience">Early Stop Patience</label>
      <input type="number" id="patience" name="patience" 
             value="50" min="10" max="200" step="10">
      <small>Epochs to wait before stopping</small>
    </div>

    <div class="form-group">
      <label for="device">Device</label>
      <select id="device" name="device">
        <option value="0" selected>GPU 0</option>
        <option value="1">GPU 1</option>
        <option value="cpu">CPU</option>
      </select>
    </div>

    <div class="form-group">
      <label for="lr0">Learning Rate</label>
      <input type="number" id="lr0" name="lr0" 
             value="0.01" min="0.0001" max="0.1" step="0.001">
      <small>Default 0.01 works for most cases</small>
    </div>

  </fieldset>
  -->
  <button type="submit">Start Training</button>
</form>
</div>
{% endblock %}
