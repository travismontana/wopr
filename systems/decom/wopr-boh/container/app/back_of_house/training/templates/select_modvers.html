{% extends "base.html" %}

{% block main_subheader %}

{% block content %}

    {% csrf_token %}
<select name="modelvers_select">
    {% for mod in model_vers %}
    Version: <option value="{{ mod.id }}">{{ mod.version }}</option>
    {% endfor %}
</select>
<input type="submit" value="Start Training" formaction="{% url 'start_training' %}">
</form>
{% endblock %}
