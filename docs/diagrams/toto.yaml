data_model_migration:
  overview:
    scope: 
      - wopr-api
      - wopr-web
      - wopr-model
    excluded_changes:
      - last_operation to operations migration (user will handle)
      - version field additions (user will handle)
    key_change: Switch from simple types to nested dict structures for model_status, version, and operations fields

  systems:
    wopr-api:
      files:
        - path: systems/wopr-api/container/app/models/models.py
          changes:
            - type: field_type_change
              field: version
              current: Optional[int]
              new: dict
              structure:
                current_version: int
                note: Optional[str]
                wopr_version: Optional[str]
                previous_versions: Optional[dict]
              priority: high

            - type: field_type_change
              field: model_status
              current: Optional[str]
              new: dict
              structure: 
                backup: Optional[dict]
                checksum: Optional[str]
                has_distfile: Optional[bool]
                filename:  Optional[bool]
                active:  Optional[bool]
              priority:  high

            - type: add_field
              field: operations
              field_type: Optional[dict]
              structure:
                task:  str
                data: str
                note: str
                extradata:  str
                status: str
              priority: high

            - type:  remove_field
              field: url
              reason: Not present in new data diagram
              priority: medium

            - type: update_class
              class: ModelUpdate
              action: Update all fields to match new ModelBase structure with dict types
              priority: high

          updated_code_example:
            ModelBase: |
              class ModelBase(BaseModel):
                  name: str
                  model_status: dict  # StatusDict
                  version: dict  # VersionDict
                  note:  Optional[str] = None
                  familyid: Optional[int] = None
                  shortname: Optional[str] = None
                  operations: Optional[dict] = None  # OperationsDict
                  description: Optional[str] = None
                  date_updated: Optional[datetime] = None

    wopr-model:
      files:
        - path: systems/wopr-model/container/app/api/models.py
          changes:
            - type: field_rename
              field: last_operation
              new_name: operations
              note: User indicated they will handle this migration
              priority: high
              affected_locations:
                - line_approx: 38
                  function: handle_error
                  current: data.last_operation = last_operation
                  new: data.operations = operations

            - type: update_operation_dict
              location: handle_error function
              current_structure: 
                task: caller
                data: data.model
                note: note
                extradata: extradata
                status: status
              new_structure: Same structure, just rename variable from last_operation to operations
              priority: high

          notes: 
            - ModelStatus is a runtime/API model, not stored in Directus
            - Consider keeping it separate from Directus-sourced models
            - Align field names for consistency across services

    wopr-web: 
      files:
        - path: systems/wopr-web/container/app/models/models. py
          changes:
            - type: add_field
              field: operations
              field_type:  Optional[dict]
              structure: 
                task: str
                data: str
                note: str
                extradata: str
                status: str
              priority: high

            - type: consider_adding
              fields: 
                - downloaded
                - distfile
              reason: Present in wopr-model's ModelStatus, may be needed for consistency
              priority:  low

          updated_code_example:
            ModelStatus: |
              class ModelStatus(BaseModel):
                  model: str
                  backedup: bool = False
                  checksum: str = None
                  has_distfile: bool = False
                  filename: str = None
                  operations: Optional[dict] = None

        - path: systems/wopr-web/container/app/lib/models_lib.py
          changes:
            - type: update_function
              function: check_data
              line_approx: 76
              current_code: |
                if data['last_operation']['status'] != "success": 
                    st.error(f"Operation ({data['last_operation']['task']}) failed\n"
                    f"Note: ({data['last_operation']['note']})\n"
                    f"Extra Data: ({data['last_operation']['extradata']})")
              new_code: |
                if data['operations']['status'] != "success":
                    st.error(f"Operation ({data['operations']['task']}) failed\n"
                    f"Note: ({data['operations']['note']})\n"
                    f"Extra Data: ({data['operations']['extradata']})")
              priority: high

            - type:  review_required
              scope: All UI/display code
              reason:  Model status and version are now dicts, UI code must handle nested structures
              priority: medium

  cross_system_changes:
    openapi_schema_sourcing: 
      description: Data models will be sourced from openapi.json instead of explicit definitions
      tasks: 
        - system: wopr-api
          action: create_or_update_openapi_json
          details: FastAPI automatically generates at /openapi.json endpoint.  Ensure new dict-based structures are reflected.
          priority: high

        - system: wopr-web
          action: fetch_schemas_from_api
          endpoint: https://api.wopr.tailandtraillabs.org/openapi.json
          implementation_example: |
            import httpx
            response = httpx.get('https://api.wopr.tailandtraillabs.org/openapi. json')
            schemas = response. json()
          priority: medium

        - system: wopr-model
          action: fetch_schemas_from_api
          endpoint: https://api.wopr.tailandtraillabs.org/openapi.json
          priority: medium

        - system:  all
          action: remove_redundant_model_definitions
          details: Remove explicit Pydantic model definitions once sourcing from OpenAPI (except service-specific models)
          priority: low

    data_migration:
      database: Directus models table
      tasks:
        - field: version
          action:  Convert integer to dict
          transformation:  "old_value -> {'current_version': old_value}"
          priority: critical

        - field: model_status
          action: Convert string to dict
          transformation: Create appropriate dict structure based on old string value
          priority: critical

        - field: operations
          action: Add empty dict to existing records
          default_value: "{}"
          priority: high

      backward_compatibility:
        recommendation:  Add validation/migration helpers to handle old vs new data formats during transition
        priority: high

  search_recommendations:
    note:  Search results were limited to 10 results per query. Additional references may exist.
    recommended_searches:
      - term: model_status
        url: https://github.com/travismontana/wopr/search?q=model_status
        reason: Find all references to model_status field

      - term: last_operation
        url: https://github.com/travismontana/wopr/search?q=last_operation
        reason: Find all references to last_operation field

      - term: version
        url: https://github.com/travismontana/wopr/search? q=version+path%3Asystems
        reason: Find all references to version field in systems directories

  summary:
    total_files_to_modify: 4
    systems_affected: 3
    high_priority_changes: 9
    medium_priority_changes: 3
    low_priority_changes: 2
    critical_changes: 2
    
    key_risks:
      - Data migration in Directus database must be completed before deploying code changes
      - Breaking changes to API contracts between services
      - UI components may break if not updated to handle dict structures

    recommended_order:
      - step:  1
        action: Database migration (version and model_status fields)
      - step: 2
        action: Update wopr-api models. py
      - step: 3
        action: Deploy wopr-api and verify /openapi.json
      - step: 4
        action: Update wopr-model and wopr-web
      - step: 5
        action:  Test end-to-end workflows